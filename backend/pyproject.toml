[project]
name = "omacal"
version = "0.3.0"
description = "CalDAV calendar for the Omarchy desktop"
requires-python = ">=3.12"
dependencies = [
    "caldav>=3.3",
    "icalendar>=6.0",
    "keyring>=25.0",
    "dnspython>=2.6",
]

[project.scripts]
omacal = "omacal.cli:main"
omacal-api = "omacal.api:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["omacal*"]
